name: Build TagTinker FAP

# Run this manually from the "Actions" tab on GitHub - no local install needed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Espressif's own Docker image - already has the exact ESP-IDF v5.4.1
    # toolchain installed, so nothing needs to be downloaded/compiled by hand.
    container:
      image: espressif/idf:v5.4.4

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Build the firmware once (needed before any app can be built)
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build_t_embed set-target esp32s3
          idf.py -B build_t_embed -DFLIPPER_BOARD=lilygo_t_embed_cc1101 reconfigure build

      - name: Build the TagTinker app (.fap)
        run: |
          . "$IDF_PATH/export.sh"
          ./buildFap.sh applications_user/TagTinker

      - name: Upload the .fap so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: tagtinker-fap
          path: build_t_embed/fap/tagtinker2.fap
          if-no-files-found: error
